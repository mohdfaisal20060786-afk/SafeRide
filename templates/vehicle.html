<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/vehicle.css') }}">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehicle Details - SafeRide</title>

    <style>

        .edit-form {
            display: none;
            margin-top: 20px;
        }

        .edit-form input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .edit-button,
        .delete-button,
        .cancel-button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-button {
            background: #ef3340;
            color: white;
        }

        .delete-button {
            background: #333;
            color: white;
        }

        .cancel-button {
            background: #777;
            color: white;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚗 Vehicle Details</h1>


        {% if vehicle %}

        <!-- SAVED VEHICLE -->

        <div class="vehicle-box">

            <h2>Saved Vehicle</h2>

            <p>
                <strong>Number:</strong>
                {{ vehicle["vehicle_number"] }}
            </p>

            <p>
                <strong>Model:</strong>
                {{ vehicle["vehicle_model"] or "Not provided" }}
            </p>

            <p>
                <strong>Color:</strong>
                {{ vehicle["vehicle_color"] or "Not provided" }}
            </p>


            <!-- EDIT BUTTON -->

            <button
                type="button"
                class="edit-button"
                onclick="showEditForm()"
            >
                ✏️ Edit Vehicle
            </button>


            <!-- DELETE BUTTON -->

            <form
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete this vehicle?');"
            >

                <input
                    type="hidden"
                    name="action"
                    value="delete"
                >

                <button
                    type="submit"
                    class="delete-button"
                >
                    🗑️ Delete Vehicle
                </button>

            </form>


            <!-- EDIT FORM -->

            <div class="edit-form" id="editForm">

                <form method="POST">

                    <input
                        type="hidden"
                        name="action"
                        value="save"
                    >

                    <label>Vehicle Number</label>

                    <input
                        type="text"
                        name="vehicle_number"
                        value="{{ vehicle['vehicle_number'] }}"
                        required
                    >


                    <label>Vehicle Model</label>

                    <input
                        type="text"
                        name="vehicle_model"
                        value="{{ vehicle['vehicle_model'] or '' }}"
                    >


                    <label>Vehicle Color</label>

                    <input
                        type="text"
                        name="vehicle_color"
                        value="{{ vehicle['vehicle_color'] or '' }}"
                    >


                    <button
                        type="submit"
                        class="edit-button"
                    >
                        💾 Save Changes
                    </button>


                    <button
                        type="button"
                        class="cancel-button"
                        onclick="hideEditForm()"
                    >
                        Cancel
                    </button>

                </form>

            </div>

        </div>

        {% else %}

        <!-- ADD VEHICLE -->

        <form method="POST">

            <input
                type="hidden"
                name="action"
                value="save"
            >

            <label>Vehicle Number</label>

            <input
                type="text"
                name="vehicle_number"
                placeholder="e.g. UP81AB1234"
                required
            >


            <label>Vehicle Model</label>

            <input
                type="text"
                name="vehicle_model"
                placeholder="e.g. Honda City"
            >


            <label>Vehicle Color</label>

            <input
                type="text"
                name="vehicle_color"
                placeholder="e.g. Black"
            >


            <button type="submit">
                Save Vehicle
            </button>

        </form>

        {% endif %}

    </div>


    <script>

        function showEditForm() {
            document.getElementById("editForm").style.display = "block";
        }

        function hideEditForm() {
            document.getElementById("editForm").style.display = "none";
        }

    </script>

</body>

</html>
