<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SafeRide</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🚨 SafeRide
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to access your accident detection dashboard
            </p>

            <form method="POST" action="/login">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </div>

</body>
</html>
